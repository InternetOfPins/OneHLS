[platformio]

; HAPI/OneData resolve from their real published repos, not a sibling
; monorepo checkout -- this example must build for anyone who clones
; just this repo (github.com/InternetOfPins/OneHLS), not only someone
; with the whole IOP tree on disk. OneHLS's own current code (not
; whatever the last published OneHLS release was) resolves locally via
; file:// -- this example is testing the code sitting right here, two
; directories up, not a re-fetched copy of itself.
[env]
lib_deps =
    file://../..
    https://github.com/InternetOfPins/HAPI.git
    https://github.com/InternetOfPins/OneData.git

[env:native]
platform = native
build_flags = -std=c++17
debug_build_flags = -O0 -ggdb3 -g3
extra_scripts = pre:extra_hls.py

[env:hls]
; Not a real PlatformIO build target -- Bambu synthesizes RTL, not a
; linked executable, so there is nothing for PlatformIO's own toolchain
; to build here. This env exists only so `pio run -e hls -t <target>`
; is a valid, discoverable entry point; the actual work happens in
; extra_hls.py's custom target (synthesize-float-fir), which locates
; HAPI/OneData's headers from THIS env's own resolved lib_deps rather
; than assuming a monorepo-relative path, for the same standalone-repo
; reason as above.
platform = native
build_flags = -std=c++17
extra_scripts = pre:extra_hls.py
