[platformio]

; HAPI/OneData resolve from their real published repos, not a sibling
; monorepo checkout -- this example must build for anyone who clones just
; github.com/InternetOfPins/OneHLS. OneHLS's own current code resolves
; locally via file:// -- two directories up.
[env]
lib_deps =
    file://../..
    https://github.com/InternetOfPins/HAPI.git
    https://github.com/InternetOfPins/OneData.git

[env:native]
platform = native
build_flags = -std=c++17
debug_build_flags = -O0 -ggdb3 -g3
extra_scripts = pre:extra_hls.py

[env:hls]
; Not a real PlatformIO build target -- Bambu synthesizes RTL, not a
; linked executable. This env only makes `pio run -e hls -t <target>` a
; discoverable entry point; the work happens in extra_hls.py's custom
; targets (synthesize-line-buffer / -window-extract / -conv-layer /
; -two-layer / -multi-conv / -axis / -erode ...), which locate
; HAPI/OneData headers from THIS env's own resolved lib_deps.
platform = native
build_flags = -std=c++17
extra_scripts = pre:extra_hls.py
